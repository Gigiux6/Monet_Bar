<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recupero Password | Monet Bar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #121212;
      --surface-dark: #1E1E1E;
      --accent-gold: #D4AF37;
      --text-cream: #FDFBF7;
      --text-muted: #A0A0A0;
      --error-red: #FF5252;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: linear-gradient(135deg, var(--bg-dark), #1a1a1a);
      color: var(--text-cream);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background: rgba(30, 30, 30, 0.8);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .logo-container {
      width: 100px;
      height: 100px;
      margin: 0 auto 20px;
      border-radius: 50%;
      border: 2px solid rgba(212, 175, 55, 0.3);
      padding: 15px;
      background: rgba(212, 175, 55, 0.05);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .logo-container img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      color: var(--accent-gold);
      margin-bottom: 10px;
      font-size: 24px;
      letter-spacing: 1px;
    }

    p {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    input {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(212, 175, 55, 0.3);
      padding: 15px;
      border-radius: 10px;
      color: var(--text-cream);
      font-family: 'Outfit', sans-serif;
      font-size: 16px;
      outline: none;
      transition: border-color 0.3s;
    }

    input:focus {
      border-color: var(--accent-gold);
    }

    input::placeholder {
      color: rgba(253, 251, 247, 0.3);
    }

    button {
      background: var(--accent-gold);
      color: var(--bg-dark);
      border: none;
      padding: 15px;
      border-radius: 10px;
      font-family: 'Outfit', sans-serif;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s, transform 0.1s;
      margin-top: 10px;
    }

    button:hover {
      background: #E5C158;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      background: #555;
      color: #888;
      cursor: not-allowed;
    }

    .message {
      margin-top: 20px;
      font-size: 14px;
      min-height: 20px;
    }

    .error { color: var(--error-red); }
    .success { color: #4CAF50; }
  </style>
</head>
<body>

  <div class="container" id="main-container">
    <div class="logo-container">
      <!-- Fallback SVG icon if logo.png doesn't load immediately -->
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#D4AF37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 22h8"/>
        <path d="M12 22v-4"/>
        <path d="M10 12v6"/>
        <path d="M14 12v6"/>
        <path d="M6 3v5a6 6 0 0 0 12 0V3"/>
      </svg>
    </div>
    
    <h1>Nuova Password</h1>
    <p id="instruction-text">Inserisci la tua nuova password per l'account.</p>

    <form id="reset-form">
      <input type="password" id="new-password" placeholder="Nuova password (min. 6 caratteri)" required minlength="6">
      <input type="password" id="confirm-password" placeholder="Conferma nuova password" required minlength="6">
      <button type="submit" id="submit-btn">AGGIORNA PASSWORD</button>
    </form>

    <div id="message-box" class="message"></div>
  </div>

  <!-- Firebase SDK (Modular v10) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, confirmPasswordReset, verifyPasswordResetCode } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // Firebase Configuration from Flutter app
    const firebaseConfig = {
      apiKey: 'AIzaSyB_WJjnI58fjwmbzGPjcwHO6u1L6L4DTlA',
      authDomain: 'monet-bar.firebaseapp.com',
      projectId: 'monet-bar',
      appId: '1:114612287389:web:f6976c252a861ead4e2174',
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Get URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    const mode = urlParams.get('mode');
    const oobCode = urlParams.get('oobCode');

    const form = document.getElementById('reset-form');
    const newPasswordInput = document.getElementById('new-password');
    const confirmPasswordInput = document.getElementById('confirm-password');
    const submitBtn = document.getElementById('submit-btn');
    const messageBox = document.getElementById('message-box');

    function showMessage(msg, isError = false) {
      messageBox.textContent = msg;
      messageBox.className = 'message ' + (isError ? 'error' : 'success');
    }

    // Verify if we have the correct mode and code
    if (mode !== 'resetPassword' || !oobCode) {
      form.style.display = 'none';
      document.getElementById('instruction-text').style.display = 'none';
      showMessage('Link non valido o scaduto. Richiedi un nuovo link di recupero password dall\'app.', true);
    } else {
      // Verify code optionally
      verifyPasswordResetCode(auth, oobCode).then((email) => {
        document.getElementById('instruction-text').textContent = 'Imposta la nuova password per ' + email;
      }).catch((error) => {
        form.style.display = 'none';
        showMessage('Il link di recupero è scaduto o non valido. Riprova.', true);
      });
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      
      const newPassword = newPasswordInput.value;
      const confirmPassword = confirmPasswordInput.value;

      if (newPassword !== confirmPassword) {
        showMessage('Le password non coincidono.', true);
        return;
      }

      if (newPassword.length < 6) {
        showMessage('La password deve avere almeno 6 caratteri.', true);
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'ATTENDERE...';
      showMessage('');

      confirmPasswordReset(auth, oobCode, newPassword)
        .then(() => {
          form.style.display = 'none';
          document.getElementById('instruction-text').style.display = 'none';
          showMessage('Password aggiornata con successo! Ora puoi tornare all\'app Monet Bar e fare il login.');
        })
        .catch((error) => {
          submitBtn.disabled = false;
          submitBtn.textContent = 'AGGIORNA PASSWORD';
          showMessage('Si è verificato un errore: ' + error.message, true);
        });
    });
  </script>
</body>
</html>
